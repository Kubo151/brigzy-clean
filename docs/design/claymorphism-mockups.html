<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brigzy.sk — Claymorphism mockups v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--font:'Manrope',-apple-system,system-ui,'Segoe UI',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);-webkit-font-smoothing:antialiased;}
  body{background:radial-gradient(1200px 620px at 50% -12%,#1b1b29,#0b0b11 62%);color:#e9e9f0;
       padding:28px 16px 90px;min-height:100vh;}
  header.top{max-width:1320px;margin:0 auto;}
  h1{font-size:22px;font-weight:800;letter-spacing:-.6px;}
  .sub{color:#9a9ab0;font-size:13px;margin-top:6px;line-height:1.6;}
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px auto 0;max-width:1320px;}
  .tab{display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;border:1px solid #28283a;
       background:#14141e;color:#d2d2e2;cursor:pointer;font-weight:700;font-size:13px;transition:.15s;letter-spacing:.2px;}
  .tab:hover{border-color:#3a3a52;}
  .tab.active{background:linear-gradient(160deg,#9863F2,#7C3AED);border-color:#7C3AED;color:#fff;box-shadow:0 10px 26px rgba(124,58,237,.42);}
  .swatch{width:13px;height:13px;border-radius:5px;}
  .palnote{max-width:1320px;margin:16px auto 24px;color:#8a8aa0;font-size:13px;line-height:1.55;}
  .stage{display:none;} .stage.active{display:block;}
  .grid{display:flex;gap:38px;flex-wrap:wrap;justify-content:center;max-width:1400px;margin:0 auto;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .label{font-size:11.5px;color:#9a9ab0;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}

  .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .ic.fill{fill:currentColor;stroke:none;}
  .s14{width:14px;height:14px;}.s16{width:16px;height:16px;}.s18{width:18px;height:18px;}.s22{width:22px;height:22px;}.s24{width:24px;height:24px;}.s26{width:26px;height:26px;}.s30{width:30px;height:30px;}

  /* PHONE */
  .phone{width:298px;height:624px;border-radius:54px;padding:9px;position:relative;
         background:linear-gradient(155deg,#43434f,#17171f);
         box-shadow:0 36px 84px rgba(0,0,0,.62),inset 0 0 0 2px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.13);}
  .screen{width:100%;height:100%;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.022;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:86px;height:23px;background:#000;border-radius:13px;z-index:40;}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:15px 24px 2px;font-size:12.5px;font-weight:700;color:var(--text);}
  .body{flex:1;overflow:hidden;padding:10px 17px 0;display:flex;flex-direction:column;gap:13px;position:relative;z-index:2;}
  .scrollfade{position:absolute;bottom:66px;left:0;right:0;height:46px;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:5;}

  /* CLAY — premium soft-UI: lighter dual shadow + hairline rim light */
  .clay{background:linear-gradient(145deg,var(--cHi),var(--cLo));border-radius:22px;border:1px solid var(--hair);
        box-shadow:7px 7px 16px var(--sd),-5px -5px 12px var(--sl);}
  .clay-sm{background:linear-gradient(145deg,var(--cHi),var(--cLo));border-radius:16px;border:1px solid var(--hair);
        box-shadow:5px 5px 12px var(--sd),-4px -4px 9px var(--sl);}
  .inset{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);background:var(--cLo);border:1px solid var(--hairIn);}
  .pill{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:13px;background:linear-gradient(145deg,var(--cHi),var(--cLo));
        font-size:12px;font-weight:700;color:var(--text);border:1px solid var(--hair);box-shadow:4px 4px 9px var(--sd),-3px -3px 7px var(--sl);white-space:nowrap;}
  .pill.on{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);border-color:transparent;box-shadow:4px 5px 12px var(--accentSd);}
  .pill.icononly{padding:9px;}
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:18px;
       background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);font-weight:800;font-size:15px;letter-spacing:-.2px;
       box-shadow:6px 8px 18px var(--accentSd),-3px -3px 9px var(--sl);overflow:hidden;}
  .btn::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:linear-gradient(rgba(255,255,255,.25),transparent);}
  .btn-ghost{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:18px;background:linear-gradient(145deg,var(--cHi),var(--cLo));
       color:var(--text);font-weight:800;font-size:15px;border:1px solid var(--hair);box-shadow:5px 5px 12px var(--sd),-4px -4px 9px var(--sl);}
  .row{display:flex;align-items:center;gap:10px;}.between{justify-content:space-between;}.col2{display:flex;flex-direction:column;}.wrap{flex-wrap:wrap;}
  .muted{color:var(--muted);}.h{font-weight:800;letter-spacing:-.4px;}.sb7{font-weight:700;}
  .sec{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);}
  .icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--accent);
        background:var(--accentDim);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);}
  .avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);
          background:var(--accentDim);border:1px solid var(--hair);box-shadow:4px 4px 9px var(--sd),-3px -3px 7px var(--sl);}
  .tag-sos{display:flex;align-items:center;gap:5px;background:linear-gradient(160deg,#FF6B5E,#FF3B30);color:#fff;padding:5px 9px;border-radius:10px;
           font-size:10px;font-weight:800;letter-spacing:.3px;box-shadow:3px 5px 12px rgba(255,59,48,.42);}
  .chip-pay{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);padding:7px 12px;border-radius:12px;font-weight:800;font-size:13px;box-shadow:4px 5px 12px var(--accentSd);}
  .verified{display:inline-flex;color:#2EA8FF;}
  .stars{color:#FFB300;display:flex;gap:1px;}.stars .ic{stroke:none;fill:#FFB300;}
  .divider{height:1px;background:var(--sd);opacity:.5;}
  .b15{font-size:15px;}.b14{font-size:14px;}.b13{font-size:13px;}.b12{font-size:12px;}.tiny{font-size:10.5px;}
  .mt2{margin-top:2px;}.mt6{margin-top:6px;}.mt10{margin-top:10px;}.mt14{margin-top:14px;}.mtA{margin-top:auto;}.lh{line-height:1.55;}
  .bar{height:11px;border-radius:7px;background:var(--cLo);border:1px solid var(--hairIn);box-shadow:inset 3px 3px 6px var(--sd),inset -2px -2px 5px var(--sl);overflow:hidden;}
  .fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:7px;}
  .field{background:var(--cLo);border-radius:14px;padding:12px 14px;border:1px solid var(--hairIn);box-shadow:inset 4px 4px 8px var(--sd),inset -3px -3px 7px var(--sl);}
  .toggle{width:46px;height:26px;border-radius:14px;background:linear-gradient(160deg,var(--accent2),var(--accent));position:relative;box-shadow:inset 2px 2px 5px rgba(0,0,0,.2);}
  .toggle::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:1px 1px 3px rgba(0,0,0,.3);}
  .badge{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
  .bi{width:46px;height:46px;border-radius:15px;background:var(--accentDim);color:var(--accent);display:flex;align-items:center;justify-content:center;
      border:1px solid var(--hair);box-shadow:4px 4px 9px var(--sd),-3px -3px 7px var(--sl);}
  .logo{width:60px;height:60px;border-radius:20px;background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);
        display:flex;align-items:center;justify-content:center;box-shadow:7px 9px 20px var(--accentSd),inset 0 2px 3px rgba(255,255,255,.4);}

  .tabbar{position:absolute;bottom:0;left:0;right:0;height:66px;background:linear-gradient(145deg,var(--cHi),var(--cLo));border-radius:26px 26px 0 0;
          display:flex;align-items:center;justify-content:space-around;box-shadow:0 -6px 16px var(--sd);z-index:10;padding:0 16px;border-top:1px solid var(--hair);}
  .tb{color:var(--muted);opacity:.65;}.tb.on{color:var(--accent);opacity:1;}
  .tb.center{position:relative;width:52px;height:52px;border-radius:50%;color:var(--onAccent);background:linear-gradient(160deg,var(--accent2),var(--accent));
             display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:6px 8px 18px var(--accentSd),-3px -3px 8px var(--sl);}

  .map{flex:1;border-radius:22px;position:relative;overflow:hidden;min-height:160px;border:1px solid var(--hair);
       background:radial-gradient(circle at 28% 26%,var(--mapHi),transparent 55%),radial-gradient(circle at 76% 72%,var(--mapHi),transparent 50%),
                  repeating-linear-gradient(0deg,var(--mapLine) 0 1px,transparent 1px 38px),repeating-linear-gradient(90deg,var(--mapLine) 0 1px,transparent 1px 38px),var(--mapBg);
       box-shadow:inset 5px 5px 12px var(--sd),inset -5px -5px 12px var(--sl);}
  .road{position:absolute;height:7px;border-radius:7px;background:var(--cHi);opacity:.55;}
  .pin{position:absolute;display:flex;align-items:center;gap:4px;background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);
       padding:6px 9px;border-radius:12px;font-size:10.5px;font-weight:800;box-shadow:3px 5px 12px var(--accentSd);transform:translate(-50%,-50%);border:2px solid var(--cHi);}
  .pin.sos{background:linear-gradient(160deg,#FF6B5E,#FF3B30);box-shadow:3px 5px 13px rgba(255,59,48,.5);}
  .pin::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--accent);}
  .pin.sos::after{border-top-color:#FF3B30;}

  .bub{max-width:78%;padding:11px 14px;border-radius:17px;font-size:12.5px;line-height:1.45;}
  .bub.them{background:linear-gradient(145deg,var(--cHi),var(--cLo));color:var(--text);align-self:flex-start;border-bottom-left-radius:6px;border:1px solid var(--hair);box-shadow:4px 4px 11px var(--sd),-3px -3px 8px var(--sl);}
  .bub.me{background:linear-gradient(160deg,var(--accent2),var(--accent));color:var(--onAccent);align-self:flex-end;border-bottom-right-radius:6px;box-shadow:4px 5px 12px var(--accentSd);}
  .checkbox{width:23px;height:23px;border-radius:7px;color:var(--onAccent);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(160deg,var(--accent2),var(--accent));box-shadow:3px 3px 8px var(--accentSd);}
  .glow{position:absolute;width:160px;height:160px;border-radius:50%;background:var(--accentGlow);filter:blur(46px);opacity:.65;pointer-events:none;}

  .pal-purple{--bg:#ECE9F5;--cHi:#F8F6FD;--cLo:#ECE9F6;--sd:#C9C3DF;--sl:#FFFFFF;--hair:rgba(255,255,255,.65);--hairIn:rgba(255,255,255,.4);
    --accent:#7C3AED;--accent2:#9863F2;--accentDim:#E7DEFB;--accentSd:rgba(124,58,237,.28);--accentGlow:rgba(124,58,237,.38);--onAccent:#fff;
    --text:#2A2440;--muted:#8C86A6;--mapBg:#E1DEF0;--mapLine:rgba(124,58,237,.06);--mapHi:rgba(124,58,237,.11);}
  .pal-pastel{--bg:#F2EEE7;--cHi:#FDFBF7;--cLo:#F3EFE8;--sd:#E0D5C7;--sl:#FFFFFF;--hair:rgba(255,255,255,.7);--hairIn:rgba(255,255,255,.45);
    --accent:#D8755A;--accent2:#E89376;--accentDim:#F6DFD4;--accentSd:rgba(216,117,90,.28);--accentGlow:rgba(216,117,90,.3);--onAccent:#fff;
    --text:#3A322D;--muted:#A0938A;--mapBg:#E8E1D6;--mapLine:rgba(120,95,70,.055);--mapHi:rgba(205,235,217,.5);}
  .pal-pastel .icon,.pal-pastel .bi{color:#3DA67A;background:#CFEEDC;}
  .pal-pastel .avatar{color:#8257C7;background:#E4D8F6;}
  .pal-dark{--bg:#15121E;--cHi:#272234;--cLo:#1D1928;--sd:#0A0810;--sl:#332C46;--hair:rgba(255,255,255,.055);--hairIn:rgba(255,255,255,.03);
    --accent:#A78BFA;--accent2:#8B6CF0;--accentDim:#2C2540;--accentSd:rgba(167,139,250,.3);--accentGlow:rgba(167,139,250,.42);--onAccent:#17132A;
    --text:#F1EEFA;--muted:#9A91B4;--mapBg:#1A1626;--mapLine:rgba(167,139,250,.08);--mapHi:rgba(167,139,250,.12);}
</style>
</head>
<body>
<header class="top">
  <h1>Brigzy.sk — Claymorphism mockups <span style="color:#9863F2">v3</span></h1>
  <div class="sub">10 obrazoviek × 3 palety · jemnejšie premium clay tiene + rim-light · Manrope · SVG ikony · jemný grain.<br>
  Prepínaj paletu nižšie. Dizajn tokeny prejdú 1:1 do RN komponentového kitu.</div>
</header>
<div class="tabs">
  <div class="tab active" data-p="purple"><span class="swatch" style="background:linear-gradient(160deg,#9863F2,#7C3AED)"></span>Purple Clay</div>
  <div class="tab" data-p="pastel"><span class="swatch" style="background:linear-gradient(160deg,#E89376,#D8755A)"></span>Soft Pastel</div>

</div>

<script>
